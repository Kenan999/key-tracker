<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --card-hover: #1a1a26;
    --border: #1e1e2e;
    --text: #e2e2e8;
    --text2: #8888a0;
    --muted: #565670;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.08);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.08);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.1);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.08);
    --radius: 10px;
    --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
  }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 28px 20px 40px; }
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
  .header p { font-size: 13px; color: var(--text2); margin-top: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    transition: border-color .2s;
  }
  .card:hover { border-color: #2a2a3e; }
  .card + .card { margin-top: 12px; }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-label {
    font-size: 11px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .7px; color: var(--muted);
  }
  .card-count { font-size: 12px; color: var(--muted); }

  /* Status badge */
  .status-row {
    display: flex; align-items: center; gap: 12px; padding: 4px 0;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.active { background: var(--green); box-shadow: 0 0 10px rgba(34,197,94,.4); animation: pulse 1.8s ease-in-out infinite; }
  .status-dot.inactive { background: var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
  .status-label { font-size: 13px; font-weight: 500; }
  .status-name { font-size: 13px; font-family: var(--mono); color: var(--text2); margin-left: auto; }
  .status-time { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-left: 12px; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .info-item { display: flex; flex-direction: column; gap: 4px; }
  .info-item.full { grid-column: 1/-1; }
  .info-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .info-value { font-size: 14px; font-weight: 500; word-break: break-all; }
  .info-value.mono { font-family: var(--mono); font-size: 12px; color: var(--text2); }

  /* Active list */
  .active-entry {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--border); cursor: pointer;
    transition: opacity .2s;
  }
  .active-entry:last-child { border-bottom: none; }
  .active-entry:hover { opacity: .8; }
  .active-entry .name { font-size: 13px; font-family: var(--mono); }
  .active-entry .meta { font-size: 11px; color: var(--muted); margin-left: auto; }
  .no-active { text-align: center; padding: 24px 0; color: var(--muted); font-size: 13px; }

  /* Chat bubbles */
  .chat-area { max-height: 480px; overflow-y: auto; scroll-behavior: smooth; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg { padding: 12px 14px; margin-bottom: 8px; border-radius: var(--radius); line-height: 1.55; font-size: 13px; }
  .msg.user { background: var(--blue-bg); border: 1px solid rgba(59,130,246,.15); }
  .msg.assistant { background: var(--card-hover); border: 1px solid var(--border); }
  .msg .head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; color: var(--muted);
  }
  .msg .content { white-space: pre-wrap; word-break: break-word; }
  .msg .toggle {
    display: inline-block; margin-top: 8px; font-size: 11px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .msg .toggle:hover { color: var(--text2); }
  .msg .detail {
    display: none; margin-top: 10px; padding: 10px 12px;
    background: rgba(0,0,0,.25); border-radius: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--text2);
    overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    line-height: 1.6;
  }
  .msg .detail.open { display: block; }
  .msg .detail .row { display: flex; gap: 8px; }
  .msg .detail .row .key { color: var(--muted); min-width: 80px; flex-shrink: 0; }

  /* Token bar */
  .token-bar-wrap { margin-top: 16px; }
  .token-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .token-bar-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .token-bar-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s; }

  .controls { display: flex; gap: 8px; margin-bottom: 12px; }
  .controls button {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text2); font-size: 12px; cursor: pointer;
    transition: all .15s;
  }
  .controls button:hover { background: var(--card-hover); color: var(--text); }
  .controls button.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

  .hidden { display: none !important; }

  .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 36px 0; color: var(--muted); font-size: 13px; }
  .loading .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--text2); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .refresh-bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .refresh-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
  .refresh-dot.live { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,.3); }
  .footer { text-align: center; margin-top: 24px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="header"><h1>Live Tracker</h1><p>Real-time LLM usage dashboard</p></div>

  <!-- Status -->
  <div class="card" id="statusCard">
    <div class="loading" id="statusLoading"><div class="spinner"></div>Loading…</div>
    <div class="hidden" id="statusContent">
      <div class="card-header"><span class="card-label">Status</span></div>
      <div class="status-row">
        <span class="status-dot" id="dot"></span>
        <span class="status-label" id="statusLabel">—</span>
        <span class="status-name" id="appName">—</span>
        <span class="status-time" id="lastSeen">—</span>
      </div>
    </div>
  </div>

  <!-- Active Scripts -->
  <div class="card" id="listCard">
    <div class="card-header">
      <span class="card-label">Active Scripts</span>
      <span class="card-count" id="listCount">0</span>
    </div>
    <div class="no-active" id="noActive">🔴 No Active Code</div>
    <div id="activeList"></div>
  </div>

  <!-- Chat -->
  <div class="card hidden" id="chatCard">
    <div class="card-header">
      <span class="card-label" id="chatLabel">Chat</span>
      <div class="controls">
        <button id="backBtn">← Back</button>
      </div>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="loading" id="chatLoading"><div class="spinner"></div>Loading conversation…</div>
      <div id="chatMessages"></div>
    </div>
    <div class="token-bar-wrap hidden" id="tokenBar">
      <div class="token-bar-label">
        <span>Tokens</span>
        <span id="tokenCount">0 / 128,000</span>
      </div>
      <div class="token-bar-track"><div class="token-bar-fill" id="tokenFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="refresh-bar">
    <span class="refresh-dot live" id="liveDot"></span>
    <span>Auto-refreshing every 2s</span>
  </div>
  <div class="footer">live_tracker</div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const fmtRel = ts => { const d = Date.now()/1000 - ts; if(d<5) return 'now'; if(d<60) return Math.floor(d)+'s'; if(d<3600) return Math.floor(d/60)+'m'; return Math.floor(d/3600)+'h'; };
const fmtTime = ts => new Date(ts*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});

let expanded = new Set();
let view = 'list'; // 'list' | 'chat'

function truncate(str, n=200) {
  if (!str) return '';
  return str.length > n ? str.slice(0, n) + '…' : str;
}

function renderDetailHtml(msg, i) {
  const open = expanded.has(i);
  return `
    <div class="content">${escapeHtml(msg.content || '')}</div>
    <div class="toggle" data-i="${i}">${open ? '▲ Less' : '▼ More'}</div>
    <div class="detail ${open ? 'open' : ''}" id="detail-${i}">
      <div class="row"><span class="key">model</span><span>${msg.model || '—'}</span></div>
      <div class="row"><span class="key">prompt_tokens</span><span>${msg.usage?.prompt_tokens ?? '—'}</span></div>
      <div class="row"><span class="key">completion_tokens</span><span>${msg.usage?.completion_tokens ?? '—'}</span></div>
      <div class="row"><span class="key">total_tokens</span><span>${msg.usage?.total_tokens ?? '—'}</span></div>
      <div class="row"><span class="key">finish_reason</span><span>${msg.finish_reason || '—'}</span></div>
      <div style="margin-top:8px;color:var(--muted)">request</div>
      <div>${escapeHtml(JSON.stringify(msg.request, null, 2))}</div>
    </div>`;
}

function escapeHtml(s) {
  if (typeof s !== 'string') return String(s || '');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let isNearBottom = true;

function updateScroll() {
  const ca = document.getElementById('chatArea');
  if (!ca) return;
  isNearBottom = ca.scrollHeight - ca.scrollTop - ca.clientHeight < 40;
  if (isNearBottom) ca.scrollTop = ca.scrollHeight;
}

// --- Views ---

function showList() {
  view = 'list';
  $('#listCard').classList.remove('hidden');
  $('#chatCard').classList.add('hidden');
}

function showChat(name) {
  view = 'chat';
  $('#chatLabel').textContent = 'Chat — ' + (name || '?');
  $('#listCard').classList.add('hidden');
  $('#chatCard').classList.remove('hidden');
  isNearBottom = true;
}

// --- Fetch ---

async function fetchStatus() {
  try {
    const r = await fetch('/api/live-tracker/status');
    if (!r.ok) throw Error();
    const d = await r.json();
    $('#statusLoading').classList.add('hidden');
    $('#statusContent').classList.remove('hidden');
    const dot = $('#dot');
    dot.className = 'status-dot ' + (d.active ? 'active' : 'inactive');
    $('#statusLabel').textContent = d.active ? 'Active' : 'Inactive';
    $('#appName').textContent = d.name || '—';
    $('#lastSeen').textContent = d.updated ? fmtRel(d.updated) : '—';
    return d;
  } catch { return null; }
}

async function fetchConversation() {
  try {
    const r = await fetch('/api/live-tracker/conversation');
    if (!r.ok) throw Error();
    return await r.json();
  } catch { return []; }
}

async function fetchLogs() {
  try {
    const r = await fetch('/api/logs');
    if (!r.ok) throw Error();
    return await r.json();
  } catch { return []; }
}

// --- Render ---

function renderActiveList(status, logs) {
  const container = $('#activeList');
  const count = $('#listCount');
  const no = $('#noActive');

  if (!status || !status.active) {
    container.innerHTML = '';
    count.textContent = '0';
    no.classList.remove('hidden');
    return;
  }
  no.classList.add('hidden');
  count.textContent = '1';
  container.innerHTML = `
    <div class="active-entry" data-name="${escapeHtml(status.name)}">
      <span class="status-dot active" style="width:8px;height:8px"></span>
      <span class="name">${escapeHtml(status.name)}</span>
      <span class="meta">${status.updated ? fmtRel(status.updated) : ''}</span>
    </div>`;
  container.querySelector('.active-entry').onclick = () => showChat(status.name);
}

function renderChat(convo) {
  const container = $('#chatMessages');
  const loading = $('#chatLoading');
  const tokenBar = $('#tokenBar');

  if (!convo || convo.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">No messages yet.</div>';
    loading.classList.add('hidden');
    tokenBar.classList.add('hidden');
    return;
  }

  loading.classList.add('hidden');

  let totalTokens = 0;
  let lastAssistant = null;
  convo.forEach(m => {
    if (m.usage?.total_tokens) totalTokens = m.usage.total_tokens;
    if (m.role === 'assistant') lastAssistant = m;
  });

  // Token bar from last assistant message
  if (lastAssistant?.usage?.total_tokens) {
    const used = lastAssistant.usage.total_tokens;
    const max = 128000;
    const pct = Math.min(100, (used / max) * 100);
    tokenBar.classList.remove('hidden');
    $('#tokenCount').textContent = used.toLocaleString() + ' / ' + max.toLocaleString();
    $('#tokenFill').style.width = pct + '%';
  } else {
    tokenBar.classList.add('hidden');
  }

  container.innerHTML = convo.map((m, i) => {
    if (m.role === 'system') return '';
    const cls = m.role === 'user' ? 'user' : 'assistant';
    const label = m.role === 'user' ? 'User' : (m.model ? m.model : 'Assistant');
    return `
      <div class="msg ${cls}">
        <div class="head">${label}</div>
        ${m.role === 'assistant' ? renderDetailHtml(m, i) : `<div class="content">${escapeHtml(m.content || '')}</div>`}
      </div>`;
  }).join('');

  // Attach toggle events
  container.querySelectorAll('.toggle').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.i);
      if (expanded.has(i)) expanded.delete(i); else expanded.add(i);
      renderChat(convo);
      updateScroll();
    };
  });

  updateScroll();
}

// --- Main poll ---

let status, logs, conversation;

async function poll() {
  const [s, l, c] = await Promise.all([fetchStatus(), fetchLogs(), fetchConversation()]);
  if (s) status = s;
  if (l) logs = l;
  if (c) conversation = c;

  renderActiveList(status, logs);

  if (view === 'chat') {
    renderChat(conversation);
  }
}

// --- Events ---

$('#backBtn').onclick = showList;

// --- Start ---
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
